network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: false
  vlans:

    # VLAN 10 — Servidors
    vlan10:
      id: 10
      link: eth0
      addresses:
        - 192.168.10.10/24
      nameservers:
        addresses:
          - 127.0.0.1
          - 8.8.8.8
        search:
          - elbongust.local
      routes:
        - to: default
          via: 192.168.10.1
          metric: 100

    # VLAN 20 — Staff i TPV
    vlan20:
      id: 20
      link: eth0
      addresses:
        - 192.168.20.1/24

    # VLAN 30 — Clients Wi-Fi
    vlan30:
      id: 30
      link: eth0
      addresses:
        - 192.168.30.1/24
